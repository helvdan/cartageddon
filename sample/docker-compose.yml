services:
  mysql_sample:
    image: mysql:5.7
    container_name: opencart_mysql
    restart: always
    env_file:
      - .env.mysql
    ports:
      - "3307:3306"
    volumes:
      - mysql_sample_data:/var/lib/mysql
      - ./data/dump.sql:/docker-entrypoint-initdb.d/dump.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_sample:
    image: postgres:17
    container_name: django_postgres
    restart: always
    env_file:
      - .env.postgres
    ports:
      - "5438:5432"
    volumes:
      - pg_sample_data:/var/lib/postgresql/data
      - ./data/pgdump.sql:/docker-entrypoint-initdb.d/pgdump.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  etl_cli_sample:
    build: .
    container_name: etl_cli
    volumes:
      - ..:/app
    env_file:
      - .env.mysql
      - .env.postgres
    depends_on:
      mysql_sample:
        condition: service_healthy
      postgres_sample:
        condition: service_healthy
    command: tail -f /dev/null

volumes:
  mysql_sample_data:
  pg_sample_data:
